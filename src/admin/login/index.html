<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login | Best Driving School</title>

  <link rel="stylesheet" href="../admin.css" />
</head>

<body class="admin-body">

  <main class="login-page">

    <section class="login-card">

      <a href="/" class="back-link">
        ← Back to website
      </a>

      <div class="admin-brand">
        <div class="admin-logo">BDS</div>

        <div>
          <h1>Admin Portal</h1>
          <p>Best Driving School</p>
        </div>
      </div>

      <div class="login-heading">
        <h2>Welcome back</h2>
        <p>
          Sign in to manage bookings and view the driving schedule.
        </p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            placeholder="admin@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <div
          id="loginMessage"
          class="form-message"
        ></div>

        <button
          id="loginButton"
          type="submit"
          class="primary-admin-btn"
        >
          Sign In
        </button>

      </form>

      <p class="security-text">
        Authorized Best Driving School staff only.
      </p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../supabase-config.js"></script>
  <script src="login.js"></script>

</body>
</html>
